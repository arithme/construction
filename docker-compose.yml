services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: construction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [construction_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d construction"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/construction
    ports: ["8787:8787"]
    depends_on:
      postgres: {condition: service_healthy}
volumes: {construction_pg: {}}
